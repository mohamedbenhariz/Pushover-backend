version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=pushnotify
      - POSTGRES_PASSWORD=pushnotify123
      - POSTGRES_DB=pushnotify
      - JWT_SECRET=your-jwt-secret-key
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pushnotify
      - POSTGRES_PASSWORD=pushnotify123
      - POSTGRES_DB=pushnotify
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: